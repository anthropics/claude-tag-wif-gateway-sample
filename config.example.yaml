---
# Example configuration for the Claude Tag sample gateway.
# Copy this file to config.yaml and replace every value with your own.
# The IDs below are deliberately implausible placeholders, except the
# reserved connection-check control agent, which is the same for every
# organization. Your organization ID is the org_ segment of the Subject
# prefix shown in the Connect a gateway dialog; an agent's ID appears in
# this gateway's authorization log after the agent's first request.

# The gateway address you connect in the console. The console requires
# it to be the gateway's https root URL, with no path or query string.
audience: "https://gateway.example.com"

# The accepted token issuers are not set in this file. The gateway
# accepts https://identity.anthropic.com/agents unless the environment
# variable CLAUDE_TAG_ISSUERS lists others or CLAUDE_TAG_ISSUER names
# one; see the README.

# Exact match on the full token subject. This is the recommended form
# whenever your use case allows it.
principals:
    - subject: "wimse://identity.anthropic.com/org/org_0000000000000000000EXAMPLE/agent/cagt_0000000000000000000EXAMPLE"
      principal: "example-agent"
      allowed_services: ["example-api"]
    # The connection check's control token is minted for a reserved
    # test agent; this entry lets it map without reaching any service.
    - subject: "wimse://identity.anthropic.com/org/org_0000000000000000000EXAMPLE/agent/cagt_01YcVfxkQb6JRzqk5kF2tNLh"
      principal: "registration-test-control"
      allowed_services: []

# Optional: accept every agent in your organization without pinning
# each agent's subject. The value is your organization's subject prefix,
# wimse://identity.anthropic.com/org/<YOUR_ORG_ID>/agent/ (everything in
# your agents' subjects up to and including "/agent/"; shown as "Subject
# prefix" where you register the gateway). Exact subject pins above
# still take precedence. The connection-check control agent is never
# matched here, so its pinned entry above is still required. Uncomment
# to enable; as shipped, this file has no organization mapping.
# organization_principals:
#     - subject_prefix: "wimse://identity.anthropic.com/org/org_0000000000000000000EXAMPLE/agent/"
#       principal: "any-agent-in-my-organization"
#       allowed_services: ["example-api"]

# Optional: mapping by the slack_channel_id claim instead of the
# subject; the channel_id key below is the channel ID to match against
# that claim. A channel mapping accepts a matching channel ID from ANY
# organization, so it is not a subject check: leave it commented out if
# you select the console's subject-check checkbox, and prefer subject
# pins or the organization mapping above. Uncomment only if you need it.
# channel_principals:
#     - channel_id: "C0123456789"
#       principal: "support-channel-agent"
#       allowed_services: ["example-api"]

# Downstream services reachable through the proxy route. The credential
# is read from the named environment variable at request time and never
# appears in this file.
services:
    example-api:
        description: "Example downstream REST API. Replace with your internal service."
        upstream_base_url: "https://api.example.com"
        credential_env: "EXAMPLE_API_TOKEN"
